name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck + build + 199 tests
      - run: npm run verify
      # lib/ is committed (Git installs skip the build), so a stale committed
      # bundle must fail CI rather than ship.
      - run: git diff --exit-code -- lib/
