# dsh-session-radar bundle patch: one host row that carries the plugin and,
# through `dsh.client`, its browser roster entry. Apply this bundle after
# `dsh-base` + `dsh-web-app`, which bring the sidebar shell (ui-sidebar), the
# session browser (ui-workspace), and the session status source (ui-session)
# the browser half depends on.
- insert:
    - id: session-radar
      name: 'dsh-session-radar'
